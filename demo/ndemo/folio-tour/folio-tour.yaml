# An ndemo playbook (github.com/splitbrain/ndemo) for a one-minute cut of the
# same story, played against demo/mock-server.mjs. demo/ndemo/voice.mjs voices
# the narration locally first, so no TTS key is needed. ndemo writes each
# segment's audioDuration back into this file when it renders.
titleCard:
  title: "labloop × Mubit"
  subtitle: "An AI lab that learns from each run"
  duration: 2500
app:
  url: "http://127.0.0.1:8765/"
  viewport:
    width: 1280
    height: 720
  scale: 1.5
  zoom: 1
  colorScheme: "light"
  setup:
    - run: "curl -s -X POST http://127.0.0.1:8765/__reset"
tts:
  provider: "openai"
  voice: "af_heart"
  speed: 1.1
recording:
  outputDir: "."
  fps: 30
segments:
  - id: "intro"
    narration: "This is lab loop, our project for the Mubit hackathon. It's an AI lab for protein experiments, and Mubit is what lets it learn from each run."
    intent: "Show the home page."
    timing: "parallel"
    actions:
      - type: "hover"
        target:
          selector: ".composer"
      - type: "wait"
        duration: 1500
      - type: "hover"
        target:
          selector: ".grid"
  - id: "first-run"
    narration: "We ask it to fold a thirty residue protein chain. Mubit memory has no lessons for this yet, so it plans from scratch."
    intent: "Pick the fold template and run it."
    timing: "parallel"
    actions:
      - type: "click"
        target:
          selector: "[data-tpl='fold']"
        done:
          visible: "[data-param='sequence']"
      - type: "scroll"
        target:
          selector: "#runTpl"
      - type: "click"
        target:
          selector: "#runTpl"
        done:
          visible: "h1.run"
      - type: "hover"
        target:
          selector: "h1.run"
        done:
          text:
            selector: ".cols"
            has: "papers frozen"
          timeout: 20000
  - id: "fail"
    narration: "ESMFold returns a pTM of zero point four nine four, under the zero point five it set for itself, so the run fails."
    intent: "The run fails its pTM check."
    timing: "parallel"
    actions:
      - type: "hover"
        target:
          selector: "h1.run"
        done:
          text:
            selector: ".cols"
            has: "observed 0.494"
          timeout: 30000
      - type: "scroll"
        target:
          selector: ".side .card:nth-child(3)"
  - id: "lesson"
    narration: "The reviewer writes a lesson: that floor is too strict for a chain this short. The lesson goes into Mubit memory."
    intent: "Show the summary and the lesson."
    timing: "parallel"
    actions:
      - type: "hover"
        target:
          selector: "h1.run"
        done:
          visible: ".side .card:nth-child(4)"
          timeout: 30000
      - type: "scroll"
        target:
          selector: ".side .card:nth-child(4)"
      - type: "wait"
        duration: 1500
  - id: "second-run"
    narration: "We run the same task again. Mubit recalls the lesson, and the planner sets the floor at zero point three."
    intent: "Run the same template a second time."
    timing: "parallel"
    actions:
      - type: "click"
        target:
          selector: "[data-nav='home']"
        done:
          visible: "[data-tpl='fold']"
      - type: "click"
        target:
          selector: "[data-tpl='fold']"
        done:
          visible: "[data-param='sequence']"
      - type: "scroll"
        target:
          selector: "#runTpl"
      - type: "click"
        target:
          selector: "#runTpl"
        done:
          visible: "h1.run"
  - id: "pass"
    narration: "This time it passes, and the pipeline is saved as a reusable skill."
    intent: "The second run passes and saves a skill."
    timing: "parallel"
    actions:
      - type: "hover"
        target:
          selector: "h1.run"
        done:
          visible: ".learned"
          timeout: 30000
      - type: "scroll"
        target:
          selector: ".learned"
      - type: "wait"
        duration: 1200
  - id: "outro"
    narration: "The Mubit gateway records every agent call, and Mubit memory lets each run start from what earlier runs learned."
    intent: "Hold on the saved skill."
    timing: "parallel"
    actions:
      - type: "wait"
        duration: 2000
