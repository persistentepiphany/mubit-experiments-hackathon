<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1ebe1;--ink:#2a2622;--muted:#8a847a;--card:#fff;--soft:#faf7f2;--line:rgba(42,38,34,.06);--line2:rgba(42,38,34,.12);
  --olive:#a3a07a;--clay:#c9937a;--slate:#8da2b8;--slatebg:#e6ecf2;--okbg:#e9ead9;--runbg:#f3e3da;--failbg:#f2dcd6;--fail:#b4654f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Geist',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:var(--ink)}a:hover{color:#7a7656}
textarea,input{font-family:inherit}textarea:focus,input:focus{outline:none}
button{font-family:inherit}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.app{display:flex;min-height:100vh}
nav{width:200px;flex:none;padding:28px 20px;display:flex;flex-direction:column;gap:28px;border-right:1px solid var(--line)}
.brand{font-family:'Instrument Serif',serif;font-size:24px;letter-spacing:-.01em;padding:0 8px}
.navlinks{display:flex;flex-direction:column;gap:2px}
.navbtn{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13.5px}
.navbtn.on{background:rgba(42,38,34,.06)}
.navbtn .n{margin-left:auto;font-size:11px;color:var(--muted)}
.dot{width:6px;height:6px;border-radius:50%;flex:none;display:inline-block}
.foot{margin-top:auto;font-size:11.5px;color:var(--muted);line-height:1.6;padding:0 10px}
main{flex:1;min-width:0;padding:48px 56px;max-width:1040px}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:40px;line-height:1.1;margin:0 0 8px;letter-spacing:-.015em}
h1.run{font-size:30px;line-height:1.2;letter-spacing:-.01em;text-wrap:pretty}
h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:22px;margin:0 0 14px}
.sub{margin:0;font-size:14.5px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:40px}
.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 1px 0 rgba(42,38,34,.04),0 8px 30px rgba(42,38,34,.05)}
.composer{padding:20px 22px 16px}
.composer textarea{width:100%;border:none;resize:none;font-size:16px;line-height:1.5;color:var(--ink);background:transparent}
.bar{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--bg);color:var(--ink)}
.lbl{font-size:12px;color:var(--muted)}
.primary{all:unset;cursor:pointer;background:var(--ink);color:#fff;font-size:13px;padding:9px 16px;border-radius:999px}
.primary:hover{background:#4a443c}.primary[disabled]{opacity:.5;cursor:default}
.ghost{all:unset;cursor:pointer;font-size:13px;padding:9px 14px;border-radius:999px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.tpl{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;background:#fff;border-radius:14px;padding:18px;border:1px solid var(--line)}
.tpl:hover{border-color:rgba(42,38,34,.18)}.tpl.sel{border-color:var(--ink)}
.tpl .t{display:flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500}
.tpl .d{font-size:13px;color:var(--muted);line-height:1.5}
.tpl .m{font-size:11.5px;color:var(--muted);margin-top:auto}
.params{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.params label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.params input{border:1px solid rgba(42,38,34,.1);border-radius:8px;padding:9px 11px;font-size:13.5px;color:var(--ink);background:var(--soft);width:100%}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.skillpill{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 14px;border-radius:999px;background:#fff;border:1px solid rgba(42,38,34,.08)}
.skillpill .u{color:var(--muted);font-size:11.5px}
.back{all:unset;cursor:pointer;font-size:12.5px;color:var(--muted);margin-bottom:14px;display:block}
.eyebrow{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:999px}
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr);gap:28px;align-items:start}
.step{display:grid;grid-template-columns:20px 1fr;gap:14px}
.rail{display:flex;flex-direction:column;align-items:center}
.ring{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;border:1.5px solid;box-sizing:border-box}
.ring span{width:8px;height:8px;border-radius:50%}
.line{width:1px;flex:1;margin:4px 0}
.sbody{padding-bottom:22px}
.shead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sname{font-size:14.5px;font-weight:500}.sagent{font-size:12px;color:var(--muted)}
.stime{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.sdetail{font-size:13px;color:var(--muted);line-height:1.5;margin-top:4px;overflow-wrap:anywhere}
.tag{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:11.5px;padding:3px 9px;border-radius:999px;background:var(--slatebg)}
.side{display:flex;flex-direction:column;gap:14px}
.out{display:flex;flex-direction:column;gap:3px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.out:last-child{border-bottom:none;padding-bottom:0}
.out .ot{font-size:13.5px;line-height:1.4;text-wrap:pretty;overflow-wrap:anywhere}.out .om{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.cardhead{display:flex;align-items:baseline;justify-content:space-between}
.check{display:flex;gap:10px;align-items:baseline;font-size:13px;line-height:1.45}
.check .s{font-size:11px;padding:2px 8px;border-radius:999px;flex:none}
.learned{background:var(--slatebg);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.learned .h{font-family:'Instrument Serif',serif;font-size:20px;line-height:1.25}
.learned .box{display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:10px 12px;font-size:13.5px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border-radius:12px;cursor:pointer;border:1px solid var(--line)}
.row:hover{border-color:rgba(42,38,34,.18)}
.list{display:flex;flex-direction:column;gap:8px}
.err{background:var(--failbg);border-radius:16px;padding:18px 20px;font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.skillcard{display:flex;flex-direction:column;gap:10px;background:#fff;border-radius:14px;padding:18px;border:1px solid var(--line)}
.kv{font-size:12.5px;color:var(--muted);line-height:1.5}
.ev{display:grid;grid-template-columns:58px 1fr;gap:10px;font-size:12.5px;line-height:1.45;padding:6px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:none}.ev .t{color:var(--muted);font-variant-numeric:tabular-nums}
.ev.err .m{color:var(--fail)}.ev.live .m{font-weight:500}
.livebar{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:8px 10px;border-radius:10px;background:var(--runbg);margin-top:6px}
.feed{max-height:420px;overflow-y:auto}
.mol{position:relative;width:100%;height:300px;border-radius:12px;background:#faf7f2;overflow:hidden}
.molbar{display:flex;gap:6px;flex-wrap:wrap}.molbar button{all:unset;cursor:pointer;font-size:11.5px;padding:4px 10px;border-radius:999px;background:var(--bg)}
.molbar button.on{background:var(--ink);color:#fff}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}table.t td,table.t th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{font-weight:500;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
details summary{cursor:pointer;font-size:12.5px;color:#4a443c}details p{font-size:12.5px;line-height:1.55;color:#4a443c;margin:8px 0 0}
.tl{display:grid;grid-template-columns:14px 1fr;gap:10px}.tl .d{width:9px;height:9px;border-radius:50%;margin-top:5px}
.btnlink{all:unset;cursor:pointer;font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--line2)}
.btnlink:hover{background:#fff}
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,100vw);background:var(--soft);border-left:1px solid var(--line2);box-shadow:-12px 0 40px rgba(42,38,34,.08);display:flex;flex-direction:column;z-index:20;transform:translateX(105%);transition:transform .22s ease,width .22s ease}
.drawer.open{transform:none}.drawer.wide{width:min(1100px,100vw)}
.drawer .dh{padding:18px 20px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.drawer .dt{font-family:'Instrument Serif',serif;font-size:21px;line-height:1.2;text-wrap:pretty}
.drawer .db{flex:1;min-height:0;overflow:auto}
.drawer iframe{width:100%;height:100%;border:0;background:#fff}
.drawer .txt{padding:18px 22px;font-size:13.5px;line-height:1.65;color:#2a2622;white-space:pre-wrap}
.drawer .txt h4{font-family:'Instrument Serif',serif;font-weight:400;font-size:18px;margin:18px 0 6px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line2);margin-bottom:2px;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;font-size:13px;padding:8px 12px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
[data-paper]{cursor:pointer}[data-paper]:hover .ot{text-decoration:underline}
.sdetail.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
#view.enter{animation:rise .28s ease both}
.card,.row,.skillcard,.tpl,.kpi,.flow .node{animation:rise .32s ease both}
.grid>*:nth-child(2),.list>*:nth-child(2),.kpis>*:nth-child(2){animation-delay:.04s}
.grid>*:nth-child(3),.list>*:nth-child(3),.kpis>*:nth-child(3){animation-delay:.08s}
.grid>*:nth-child(4),.list>*:nth-child(4),.kpis>*:nth-child(4){animation-delay:.12s}
.grid>*:nth-child(n+5),.list>*:nth-child(n+5),.kpis>*:nth-child(n+5){animation-delay:.16s}
.card,.skillcard,.row,.tpl{transition:box-shadow .18s ease,transform .18s ease,border-color .18s ease}
.skillcard:hover,.row:hover,.tpl:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(42,38,34,.08)}
.sk{border-radius:12px;background:linear-gradient(90deg,#ece6db 0,#f6f1e8 40%,#ece6db 80%);background-size:800px 100%;animation:shimmer 1.2s linear infinite}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 56px;background:rgba(241,235,225,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);font-size:12.5px}
.topbar .crumb{font-weight:500}.topbar .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);color:#4a443c;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:#fff;border-radius:14px;padding:14px 16px;border:1px solid var(--line)}
.kpi .v{font-family:'Instrument Serif',serif;font-size:30px;line-height:1.1}.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.flow .node{flex:1;min-width:120px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.4}
.flow .node b{display:block;font-weight:500;font-size:12.5px;margin-bottom:2px}
.flow .arr{align-self:center;padding:0 6px;color:var(--muted)}
.chain{display:grid;grid-template-columns:1fr 24px 1fr 24px 1fr;gap:6px;align-items:stretch}
.chain .c{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45}
.chain .a{align-self:center;text-align:center;color:var(--muted)}
.delta{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--slatebg)}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bg)}.badge.m{background:var(--slatebg)}.badge.z{background:#f3e3da}
.meter{height:6px;border-radius:3px;background:var(--bg);overflow:hidden}.meter>span{display:block;height:100%;background:var(--slate);transition:width .6s ease}
@media (max-width:820px){.topbar{padding:10px 16px}.chain{grid-template-columns:1fr}.chain .a{transform:rotate(90deg)}}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:var(--soft);padding:12px;border-radius:10px;margin:0}
@media (max-width:820px){
  .app{flex-direction:column}
  nav{width:auto;flex-direction:row;align-items:center;padding:14px 16px;gap:12px;border-right:none;border-bottom:1px solid var(--line);overflow-x:auto}
  .navlinks{flex-direction:row}.foot{display:none}
  main{padding:24px 16px}
  h1{font-size:30px}.cols{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <nav>
    <div class="brand">Folio</div>
    <div class="navlinks">
      <button class="navbtn" data-nav="home"><span class="dot" style="background:var(--olive)"></span>New task</button>
      <button class="navbtn" data-nav="runs"><span class="dot" style="background:var(--clay)"></span>Runs<span class="n" id="runCount"></span></button>
      <button class="navbtn" data-nav="skills"><span class="dot" style="background:var(--slate)"></span>Skills<span class="n" id="skillCount"></span></button>
      <button class="navbtn" data-nav="learning"><span class="dot" style="background:#7a9a8a"></span>Learning</button>
      <button class="navbtn" data-nav="projects"><span class="dot" style="background:#b8a3c9"></span>Projects<span class="n" id="projectCount"></span></button>
    </div>
  </nav>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
    <div class="topbar" id="topbar"><span class="crumb" id="crumb">New task</span><span style="flex:1"></span>
      <span class="pill" id="apiPill"><span class="dot" style="background:var(--muted)"></span>API</span>
      <span class="pill" id="routePill" style="display:none"></span></div>
    <main id="view"></main>
  </div>
</div>
<aside class="drawer" id="drawer" aria-label="Paper reader">
  <div class="dh"><div style="display:flex;align-items:center;gap:8px"><span class="eyebrow" id="drawerKind">Paper</span>
    <span style="margin-left:auto;display:flex;gap:6px"><button class="btnlink" id="drawerWide">Expand</button><button class="btnlink" id="drawerClose">Close</button></span></div>
    <div class="dt" id="drawerTitle"></div><div class="small muted" id="drawerMeta"></div><div style="display:flex;gap:6px;flex-wrap:wrap" id="drawerLinks"></div></div>
  <div class="db" id="drawerBody"></div>
</aside>
<script>
const TEMPLATES = [
  {id:'fold', name:'Fold a protein', color:'var(--olive)', tools:'ESMFold', eta:'about 2 min',
   desc:'Predict the structure of one chain and judge whether the fold is confident.',
   description:'Predict the 3D structure of this single protein chain and report whether the fold is confident.',
   params:[{key:'sequence', label:'Sequence', value:'GSHMKTAYIAKQRQISFVKSHFSRQLEERL'}]},
  {id:'complex', name:'Co-fold a complex', color:'var(--clay)', tools:'Boltz-2', eta:'about 6 min',
   desc:'Co-fold two chains with one seed and judge whether they form a confident interface.',
   description:'Co-fold these two short protein chains with Boltz-2 using one seed and judge whether they form a confident interface.',
   params:[{key:'chain_a', label:'Chain A', value:'MKTAYIAKQRQISFVKSHFSRQ'},{key:'chain_b', label:'Chain B', value:'GSHMLEERLKALEEKLKALEEK'}]},
  {id:'uniprot', name:'Fold a UniProt entry', color:'var(--slate)', tools:'UniProt · ESMFold', eta:'about 2 min',
   desc:'Fetch a sequence from UniProtKB by accession, then predict and grade its structure.',
   description:"Fetch this UniProt entry's sequence and predict its structure, reporting whether the fold is confident.",
   params:[{key:'accession', label:'UniProt accession', value:'P01542'}]},
];
const PHASES = [
  {key:'match', name:'Match against skills', agent:'applicability', roles:['applicability']},
  {key:'research', name:'Search the literature', agent:'researcher · extractor', roles:['researcher','extractor']},
  {key:'plan', name:'Compose a pipeline', agent:'planner', roles:['planner']},
  {key:'freeze', name:'Freeze plan and checks', agent:'sha-256'},
  {key:'run', name:'Run on Modal', agent:'tools'},
  {key:'grade', name:'Grade the checks', agent:'grader'},
  {key:'learn', name:'Record lessons', agent:'reviewer', roles:['reviewer','corrector']},
];
const S = {selected:null, skills:[], runs:[], dismissed:{}, timer:null, viewers:{}, molStyle:{}, tab:{}};
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path, opts){
  const r = await fetch(path, {headers:{'content-type':'application/json'}, ...opts});
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail ? (typeof body.detail === 'string' ? body.detail : JSON.stringify(body.detail)) : `HTTP ${r.status}`);
  return body;
}
function go(hash){ location.hash = hash; }
function fmtNum(v){ return typeof v === 'number' ? (Math.abs(v) >= 100 || Number.isInteger(v) ? String(Math.round(v*100)/100) : v.toFixed(3)) : esc(v); }
function ago(iso){ if(!iso) return ''; const s=(Date.now()-Date.parse(iso))/1000; if(s<60) return 'just now'; if(s<3600) return `${Math.floor(s/60)} min ago`; if(s<86400) return `${Math.floor(s/3600)} h ago`; return new Date(iso).toLocaleDateString(); }
function secs(a,b){ if(!a||!b) return ''; const s=Math.max(0,(Date.parse(b)-Date.parse(a))/1000); return s<60?`${Math.round(s)}s`:`${Math.floor(s/60)}m ${Math.round(s%60)}s`; }
function since(iso){ if(!iso) return ''; const s=Math.max(0,(Date.now()-Date.parse(iso))/1000); return s<60?`${Math.floor(s)}s`:`${Math.floor(s/60)}m ${String(Math.floor(s%60)).padStart(2,'0')}s`; }
function clock(iso){ return iso ? new Date(iso).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}) : ''; }
function openEvents(events){ const o={}; (events||[]).forEach(e=>{ if(!e.key) return; if(e.kind==='start') o[e.key]=e; else if(e.kind==='done'||e.kind==='error') delete o[e.key]; }); return Object.values(o); }
function liveBars(open){ return open.map(e=>`<div class="livebar"><span class="dot" style="background:var(--clay);animation:pulse 1.2s ease-in-out infinite"></span><span style="flex:1;min-width:0">${esc(e.message)}</span><span class="small muted" data-since="${esc(e.at)}">${since(e.at)}</span></div>`).join(''); }
function feed(events, running){
  const open = new Set(openEvents(events).map(e=>e.seq));
  return [...(events||[])].reverse().map(e=>`<div class="ev ${e.kind==='error'?'err':''} ${open.has(e.seq)&&running?'live':''}"><span class="t">${clock(e.at)}</span><span class="m">${esc(e.message)}${open.has(e.seq)&&running?` <span class="muted" data-since="${esc(e.at)}">${since(e.at)}</span>`:''}</span></div>`).join('') || '<div class="small muted">Waiting for the orchestrator to start…</div>';
}
setInterval(()=>document.querySelectorAll('[data-since]').forEach(el=>el.textContent=since(el.dataset.since)), 1000);
function standingPill(st){
  const m = {draft:['#f3e3da','var(--clay)'], validated:['var(--okbg)','var(--olive)'], retired:['#ece8e1','var(--muted)'], unproven:['#ece8e1','var(--muted)']}[st] || ['#ece8e1','var(--muted)'];
  return `<span class="status" style="background:${m[0]}"><span class="dot" style="background:${m[1]}"></span>${esc(st)}</span>`;
}
function verdictPill(phase, verdict){
  if (phase === 'error') return `<span class="status" style="background:var(--failbg)"><span class="dot" style="background:var(--fail)"></span>Error</span>`;
  if (phase === 'done') {
    const m = {PASS:['var(--okbg)','var(--olive)','Passed'], FAIL:['var(--failbg)','var(--fail)','Failed'], INCONCLUSIVE:['#ece8e1','var(--muted)','Inconclusive']}[verdict] || ['#ece8e1','var(--muted)', verdict||'Done'];
    return `<span class="status" style="background:${m[0]}"><span class="dot" style="background:${m[1]}"></span>${m[2]}</span>`;
  }

function paperAttrs(p, corpus){

function structurePaper(text, title){
  // Frozen JATS text keeps journal front matter before the first section; drop it and lay out sections.
  let lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const first = lines.findIndex(l => l.startsWith('## ') || /^abstract\b/i.test(l));
  const lead = first > 0 ? lines.slice(0, first).find(l => /^abstract/i.test(l) || l.length > 400) : null;
  if (first > 0) lines = lines.slice(first);
  const out = []; let words = 0;
  for (const l of lines) {
    if (l.startsWith('# ')) continue;
    if (l.startsWith('## ')) { const h = l.slice(3).trim(); if (h && h.toLowerCase() !== String(title||'').toLowerCase()) out.push(`<h4>${esc(h)}</h4>`); continue; }
    if (/^(\d+\s*){3,}/.test(l) || /creative commons|licen[cs]e|©|doi\.org|^received|^accepted/i.test(l) && l.length < 600) continue;
    out.push(`<p style="margin:0 0 10px">${esc(l)}</p>`); words += l.split(/\s+/).length;
  }
  if (lead && !out.length) out.push(`<p>${esc(lead)}</p>`);
  return `<div class="small muted" style="margin-bottom:10px">${words.toLocaleString()} words · front matter removed</div>` + out.join('');
}

function sparkline(values, color){

  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/>${v.map((x,i)=>`<circle cx="${4 + i*(W-8)/(v.length-1)}" cy="${H-4-(x-min)*(H-8)/r}" r="2.5" fill="${color}"/>`).join('')}</svg>`;
}

      <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px"><span class="small muted">${c.passes} of ${c.runs} runs passed · v${c.version}</span></div>
      <h1 class="run">${esc(s.title)}</h1><p class="sub" style="margin-top:8px">${esc(s.description)}</p></div>
    <div class="cols"><div style="display:flex;flex-direction:column;gap:14px">
      <div class="card" style="display:flex;flex-direction:column;gap:10px"><span class="eyebrow">Applies when</span>${s.applies_when.map(a=>`<div class="small">• ${esc(a)}</div>`).join('')}
        <span class="eyebrow" style="margin-top:8px">Not for</span>${s.not_for.map(a=>`<div class="small muted">• ${esc(a)}</div>`).join('') || '<div class="small muted">Nothing stated.</div>'}</div>
      <div class="card" style="display:flex;flex-direction:column;gap:10px"><span class="eyebrow">Pipeline</span>
        ${s.pipeline.steps.map(st=>`<div class="small"><strong style="font-weight:500">${esc(st.id)}</strong> · ${esc(st.tool)} <span class="muted">${esc(JSON.stringify(st.args))}</span></div>`).join('')}
        <span class="eyebrow" style="margin-top:8px">Checks</span>${s.pipeline.checks.map(ch=>`<div class="small">${esc(ch.metric)} ${esc(ch.op||'≈')} ${fmtNum(ch.value ?? ch.reference)}${ch.tolerance!=null?' ± '+fmtNum(ch.tolerance):''}</div>`).join('')}</div>
      ${renderInvocations(s, d.consultations || [])}
      ${renderProvenance(s)}
    </div>
    <div class="side">
      <div class="card" style="display:flex;flex-direction:column;gap:14px"><span class="eyebrow">Run this skill</span>
        <div class="params" style="grid-template-columns:1fr">${Object.entries(s.input_schema||{}).map(([k,v])=>`<label>${esc(k)}<span style="font-size:11px">${esc(v.description||v.type||'')}</span><input data-input="${esc(k)}" data-type="${esc(v.type||'string')}"></label>`).join('') || '<div class="small muted">This skill takes no inputs.</div>'}</div>
        <div id="skillErr" class="small" style="color:var(--fail)"></div>
        <div style="display:flex;justify-content:flex-end"><button class="primary" id="runSkill" ${c.standing==='retired'?'disabled':''}>Run skill</button></div></div>
      ${(s.lessons||[]).length ? `<div class="card" style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">Lessons</span>${s.lessons.slice(-6).map(l=>`<div class="small muted" style="line-height:1.5">• ${esc(l)}</div>`).join('')}</div>` : ''}
    </div></div></div>`;
  document.querySelectorAll('[data-run]').forEach(e => e.onclick = () => go(`#/runs/${e.dataset.run}`));
  $('#runSkill').onclick = async () => {
    const inputs = {};
    for (const i of document.querySelectorAll('[data-input]')) {
      let v = i.value.trim(); const t = i.dataset.type;
      if (t === 'integer' || t === 'number') v = Number(v); else if (t === 'boolean') v = v === 'true'; else if (t === 'array' || t === 'object') { try { v = JSON.parse(v); } catch(e) { $('#skillErr').textContent = `${i.dataset.input} must be JSON`; return; } }
      inputs[i.dataset.input] = v;
    }
    $('#runSkill').disabled = true;
    try { const r = await api(`/skills/${encodeURIComponent(name)}/run`, {method:'POST', body:JSON.stringify({inputs})}); go(`#/runs/${r.run_id}`); }
    catch(e) { $('#skillErr').textContent = e.message; $('#runSkill').disabled = false; }
  };
}

async function renderJob(){
  if (location.hash !== '#/skills' || !$('#job')) return;
  let j; try { j = (await api('/jobs')).jobs[0]; } catch(e) { return; }
  if (!j) { $('#job').innerHTML = ''; return; }
  const running = j.phase === 'running' || j.phase === undefined;
  if (!running) { $('#job').innerHTML = ''; if ($('#refreshKnowledge')) $('#refreshKnowledge').disabled = false; return; }
  let detail = {events: []}; try { detail = await api(`/jobs/${j.job_id}`); } catch(e) {}
  if (!$('#job')) return;
  $('#job').innerHTML = `<div class="card" style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px">
    <div class="cardhead"><span class="eyebrow">Knowledge refresh ${esc(j.job_id)}</span>${running?verdictPill('running'):verdictPill(j.phase==='error'?'error':'done', j.phase==='error'?null:'PASS')}</div>
    ${running ? liveBars(openEvents(detail.events)) : ''}
    <div class="feed" style="max-height:260px">${feed(detail.events, running)}</div></div>`;
  if ($('#refreshKnowledge')) $('#refreshKnowledge').disabled = running;
  clearTimeout(S.jobTimer);
  if (running) S.jobTimer = setTimeout(renderJob, 3000);
}

async function renderProjects(){
  setNav('projects'); $('#view').innerHTML = skeleton();
  let d; try { d = await api('/projects'); } catch(e) { $('#view').innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  $('#view').innerHTML = `<div class="stack" style="gap:24px"><div><h1>Projects</h1><p class="sub">Runs grouped by project, with what each project has learned.</p></div>
    <div class="grid">${d.projects.map(p => { const total = Math.max(1, p.runs);
      const seg = [['PASS','var(--olive)'],['FAIL','var(--fail)'],['INCONCLUSIVE','#c9c3b8'],['errors','#e3c2b8'],['running','var(--clay)']];
      return `<div class="skillcard"><div style="display:flex;align-items:baseline;gap:8px"><span style="font-family:'Instrument Serif',serif;font-size:21px">${esc(p.name)}</span><span class="small muted" style="margin-left:auto">${p.runs} runs · ${esc(ago(p.latest))}</span></div>
        <div style="display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--bg)">${seg.map(([k,c])=>p[k]?`<span title="${k} ${p[k]}" style="width:${100*p[k]/total}%;background:${c}"></span>`:'').join('')}</div>
        <div class="small muted">${p.PASS} passed · ${p.FAIL} failed · ${p.INCONCLUSIVE} inconclusive${p.errors?` · ${p.errors} errors`:''}${p.running?` · ${p.running} running`:''}</div>
        ${p.skills_created.length ? `<div class="pills">${p.skills_created.map(k=>`<span class="chip" style="cursor:pointer;background:var(--slatebg)" data-skill="${esc(k)}">${esc(k)}</span>`).join('')}</div>` : ''}
        ${p.skills_used.length ? `<div class="small muted">Reused ${p.skills_used.map(esc).join(', ')}</div>` : ''}
        <div style="display:flex;flex-direction:column;gap:4px;margin-top:4px">${p.recent.map(r=>`<div class="small" style="display:flex;gap:8px;align-items:center;cursor:pointer" data-run="${esc(r.run_id)}"><span class="dot" style="background:${r.verdict==='PASS'?'var(--olive)':r.verdict==='FAIL'?'var(--fail)':r.phase==='done'?'#c9c3b8':'var(--clay)'}"></span><span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.description)}</span></div>`).join('')}</div></div>`; }).join('') || '<div class="muted small">No projects yet.</div>'}</div></div>`;
  document.querySelectorAll('[data-run]').forEach(e => e.onclick = () => go(`#/runs/${e.dataset.run}`));
  document.querySelectorAll('[data-skill]').forEach(e => e.onclick = () => go(`#/skills/${e.dataset.skill}`));
}

function kpi(label, value, sub, opts = {}){
  return `<div class="kpi"><div class="l">${esc(label)}</div><div class="v" data-count="${value}" data-dec="${opts.dec||0}" data-suffix="${opts.suffix||''}">0</div>${sub?`<div class="s">${esc(sub)}</div>`:''}</div>`;
}
function hourChart(rows, keys, colors){
  if (!rows.length) return '<div class="small muted">No activity recorded yet.</div>';
  const W = 640, H = 120, bw = Math.max(6, Math.min(28, (W - 20) / rows.length - 4));
  const max = Math.max(1, ...rows.map(r => keys.reduce((a, k) => a + (r[k] || 0), 0)));
  const bars = rows.map((r, i) => { let y = H - 18; const x = 10 + i * (W - 20) / rows.length;
    return keys.map(k => { const h = (r[k] || 0) * (H - 30) / max; y -= h; return h ? `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="2" fill="${colors[k]}"><title>${esc(r.hour)} ${k} ${r[k]}</title></rect>` : ''; }).join('')
      + (i % Math.ceil(rows.length / 6) === 0 ? `<text x="${x}" y="${H-4}" font-size="10" fill="#8a847a">${esc(r.hour.slice(11,16))}</text>` : ''); }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${bars}</svg><div class="small muted" style="display:flex;gap:12px;flex-wrap:wrap">${keys.map(k=>`<span><span class="dot" style="background:${colors[k]}"></span> ${esc(k)}</span>`).join('')}</div>`;
}
function checkChange(c){ const f = x => `${x.op || '≈'} ${fmtNum(x.value ?? x.reference)}`; return `<span class="delta">${esc(String(c.metric).split('.').pop())} ${f(c.before)} → ${f(c.after)}</span>`; }
async function renderLearning(){
  setNav('learning'); $('#view').innerHTML = skeleton(4);
  let L; try { L = await api('/learning'); } catch(e) { $('#view').innerHTML = `<div class="err">${esc(e.message)}</div>`; return; }
  const T = L.totals, R = L.refresh;
  const passRate = T.runs ? 100 * T.passed / T.runs : 0;
  const mubitShare = T.calls ? 100 * T.calls_recorded_by_mubit / T.calls : 0;
  const corrections = L.corrections, fixups = L.fixups;
  const roles = L.roles.filter(r => r.calls || r.routed_to);
  $('#view').innerHTML = `<div class="stack" style="gap:30px">
    <div><h1>Learning</h1><p class="sub">How failures, corrections and new papers change the next run.</p></div>
    <div class="kpis">${kpi('Runs', T.runs, `${T.passed} passed`)}${kpi('Pass rate', passRate, 'of all runs', {dec:0, suffix:'%'})}${kpi('Corrections', R.corrections_total, 'by the Mubit corrector')}${kpi('Lessons', R.lessons_total, 'kept in memory')}${kpi('Mubit calls', T.calls_recorded_by_mubit, 'recorded by the gateway')}${kpi('Knowledge versions', R.knowledge.length, 'model-paper cards')}</div>

    <div><h2>A correction becoming an update</h2>
      <div class="flow" style="margin-bottom:14px">
        <div class="node"><b>1 · A check fails</b>The run grades FAIL or INCONCLUSIVE.</div><span class="arr">→</span>
        <div class="node"><b>2 · Mubit corrector</b>Reads the failed checks and writes a rule.</div><span class="arr">→</span>
        <div class="node"><b>3 · Rule in memory</b>Stored as a correction lesson.</div><span class="arr">→</span>
        <div class="node"><b>4 · Re-plan</b>The planner applies the rule once.</div><span class="arr">→</span>
        <div class="node"><b>5 · Model update</b>Mubit trains each role's adapter on the recorded calls.</div></div>
      <div class="list">${corrections.length ? corrections.map(c => `<div class="card" style="display:flex;flex-direction:column;gap:10px">
        <div class="chain"><div class="c"><div class="eyebrow">Run</div>${verdictPill('done', c.run.verdict)} <a href="#/runs/${esc(c.run.run_id)}">${esc(c.run.run_id)}</a><div class="muted" style="margin-top:4px">${esc(String(c.run.description).slice(0,90))}</div></div>
          <div class="a">→</div><div class="c"><div class="eyebrow">Mubit correction → ${esc(c.role)} rule</div><div class="muted">${esc(c.text)}</div><div style="margin-top:6px">${esc(c.rule)}</div></div>
          <div class="a">→</div><div class="c"><div class="eyebrow">Next run</div>${c.followups.length ? c.followups.map(f => `${verdictPill(f.phase||'done', f.verdict)} <a href="#/runs/${esc(f.run_id)}">${esc(f.run_id)}</a><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${f.diff.checks_changed.map(checkChange).join('') || '<span class="muted small">no check changed</span>'}</div>`).join('<hr style="border:0;border-top:1px solid var(--line)">') : '<span class="muted">Re-plan pending.</span>'}</div></div></div>`).join('')
        : '<div class="card small muted" style="line-height:1.6">None yet. When a run fails a check, the Mubit corrector writes a rule and the task is planned again.</div>'}</div></div>

    <div><h2>Failures fixed by the system</h2>
      <div class="list">${fixups.length ? fixups.map(f => `<div class="card"><div class="chain">
        <div class="c"><div class="eyebrow">Before</div>${verdictPill('done', f.before.verdict)} <a href="#/runs/${esc(f.before.run_id)}">${esc(f.before.run_id)}</a><div class="muted" style="margin-top:4px">${esc(String(f.task).slice(0,90))}</div>${f.error?`<div class="small" style="color:var(--fail);margin-top:4px">${esc(String(f.error).slice(0,120))}</div>`:''}</div>
        <div class="a">→</div><div class="c"><div class="eyebrow">What changed</div><div style="display:flex;gap:6px;flex-wrap:wrap">${f.diff.checks_changed.map(checkChange).join('')}${f.diff.steps_before.join(' → ') !== f.diff.steps_after.join(' → ') ? `<span class="delta">${esc(f.diff.steps_before.join(' → '))} ⇒ ${esc(f.diff.steps_after.join(' → '))}</span>` : ''}</div>${f.lessons_carried.length ? `<div class="small muted" style="margin-top:6px">${f.lessons_carried.slice(0,2).map(l=>'• '+esc(String(l).slice(0,160))).join('<br>')}</div>` : '<div class="small muted" style="margin-top:6px">Fixed in the tools or prompts between the runs.</div>'}</div>
        <div class="a">→</div><div class="c"><div class="eyebrow">After</div>${verdictPill('done', f.after.verdict)} <a href="#/runs/${esc(f.after.run_id)}">${esc(f.after.run_id)}</a></div></div></div>`).join('') : '<div class="small muted">None yet.</div>'}</div></div>

    <div><h2>Recurring tasks on Mubit</h2>
      <p class="sub" style="margin-bottom:12px">One fixed instruction per role, so Mubit groups each role's calls into one task.</p>
      <div class="card" style="padding:6px 16px"><table class="t"><tr><th>Role</th><th>Routed to</th><th>Task digest</th><th>Calls</th><th style="width:28%">Recorded by Mubit</th></tr>
        ${roles.map(r => { const pct = r.calls ? 100 * r.recorded_by_mubit / r.calls : 0, mub = String(r.routed_to||'').startsWith('mubit');
          return `<tr><td><strong style="font-weight:500">${esc(r.role)}</strong></td><td><span class="badge ${mub?'m':'z'}">${esc(String(r.routed_to||'').startsWith('mubit:') ? 'Mubit · ' + shortModel(r.routed_to) : shortModel(r.routed_to))}</span></td><td class="muted">${esc((r.prompt_digests||[]).join(', ') || '—')}</td><td>${r.calls}</td><td><div class="meter"><span style="width:${pct}%"></span></div><div class="small muted">${r.recorded_by_mubit} of ${r.calls}</div></td></tr>`; }).join('')}</table></div></div>

    <div><h2>Quality, cost and latency per role</h2>
      <p class="sub" style="margin-bottom:12px">From the call ledger.</p>
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${roles.filter(r => r.by_model.length).map(r => { const maxLat = Math.max(1, ...r.by_model.map(m => m.median_latency_s || 0));
        return `<div class="skillcard"><div style="display:flex;align-items:baseline;gap:8px"><strong style="font-weight:500">${esc(r.role)}</strong><span class="small muted" style="margin-left:auto">${r.calls} calls</span></div>
        ${r.by_model.map(m => `<div style="display:flex;flex-direction:column;gap:4px"><div class="small" style="display:flex;gap:6px;align-items:center"><span class="badge ${m.recorded_by_mubit?'m':''}">${m.recorded_by_mubit?'Mubit':esc(m.provider)}</span>${esc(m.model)}</div>
          <div class="meter"><span style="width:${100*(m.median_latency_s||0)/maxLat}%;background:${m.recorded_by_mubit?'var(--slate)':'var(--clay)'}"></span></div>
          <div class="small muted">${m.median_latency_s ?? '—'} s median · ${m.median_input_tokens ?? '—'} in / ${m.median_output_tokens ?? '—'} out tokens · ${m.cost_per_call_usd != null ? '$' + m.cost_per_call_usd.toFixed(4) + ' per call' : 'price not published'} · ${Math.round(100*m.ok_rate)}% ok · ${m.runs_passed}/${m.runs} runs passed</div></div>`).join('')}</div>`; }).join('') || '<div class="small muted">No calls logged yet.</div>'}</div>
</div>

    <div><h2>Fast refresh</h2>
      <div class="cols" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
        <div class="card"><div class="eyebrow" style="margin-bottom:8px">Runs per hour</div>${hourChart(R.runs_by_hour, ['PASS','FAIL','INCONCLUSIVE','error'], {PASS:'#a3a07a', FAIL:'#b4654f', INCONCLUSIVE:'#c9c3b8', error:'#e3c2b8'})}</div>
        <div class="card"><div class="eyebrow" style="margin-bottom:8px">Lessons learned per hour</div>${hourChart(R.lessons_by_hour, ['tool_knowledge','success','failure','fix','observation','correction'], {tool_knowledge:'#8da2b8', success:'#a3a07a', failure:'#b4654f', fix:'#c9937a', observation:'#c9c3b8', correction:'#7a9a8a'})}</div></div>
      <div class="grid" style="margin-top:12px">${Object.values(R.knowledge.reduce((a, c) => { (a[c.tool] = a[c.tool] || []).push(c); return a; }, {})).map(vs => `<div class="skillcard"><strong style="font-weight:500">${esc(vs[0].title)}</strong>${vs.map(v => `<div class="small" style="display:flex;gap:8px"><span class="badge">v${v.version}</span><span class="muted">${esc(ago(v.ingested_at))}</span><span style="margin-left:auto">${v.numbers} numbers · ${v.guidance} guidance</span></div>`).join('')}</div>`).join('')}</div></div>
  </div>`;
  countUp();
}

/* ---------------------------------------------------------------- router */
async function route(){
  clearTimeout(S.timer);
  const h = location.hash.replace(/^#/, '') || '/';
  let m;
  if ((m = h.match(/^\/runs\/(r-[0-9a-f-]+)$/))) return renderRun(m[1]);
  if (h === '/runs') return renderRuns();
  if ((m = h.match(/^\/skills\/([a-z0-9_]+)$/))) return renderSkill(m[1]);
  if (h === '/skills') return renderSkills();
  if (h === '/projects') return renderProjects();
  if (h === '/learning') return renderLearning();
  await refreshCounts(); renderHome();
}
window.addEventListener('hashchange', route);
refreshCounts().then(route); refreshStatus(); setInterval(refreshStatus, 30000);
</script>
