[project]
name = "labloop"
version = "0.1.0"
description = "Learns reusable scientific pipelines from graded runs of catalogued biomolecular tools on Modal"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "fastapi>=0.110",
    "modal>=1.0",
]

[project.optional-dependencies]
mubit = ["mubit-sdk==0.13.2"]
reports = ["matplotlib>=3.10", "gemmi>=0.7", "numpy>=1.26"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["labloop*"]

[tool.setuptools.package-data]
labloop = ["template/*", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
